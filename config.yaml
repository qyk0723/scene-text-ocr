# 场景文字检测与识别系统配置（单一事实源，代码默认读此处，CLI 参数可覆盖）

model:
  det: PP-OCRv6_small_det      # 检测模型（small=部署默认，medium=评估基准）
  rec: PP-OCRv6_small_rec      # 识别模型
  device: cpu
  lang: ch

inference:
  run_mode: paddle             # 必须 paddle：Paddle 3.3 MKLDNN 与 PIR 执行器不兼容

det:
  thresh: null                 # null = 用模型默认
  box_thresh: null
  unclip_ratio: null
  limit_side_len: null

preprocess:
  resize_long_side: 1280
  upscale_min_long_side: 800

data:
  root: data/icdar2015
